<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="scrcx banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#e8edf4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a7f5a"/>
      <stop offset="0.5" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1f2328" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="960" height="280" rx="22" fill="url(#bg)"/>
  <rect width="960" height="280" rx="22" fill="url(#dots)"/>
  <rect x="18" y="18" width="924" height="244" rx="14" fill="none" stroke="#1f2328" stroke-opacity="0.07"/>
  <rect x="0" y="0" width="960" height="280" rx="22" fill="none" stroke="#d0d7de"/>

  <!-- accent bar -->
  <rect x="62" y="176" width="270" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- wordmark -->
  <text x="60" y="142" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="78" font-weight="700" fill="#1f2328" letter-spacing="1">scrcx</text>
  <text x="62" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#47556b">Android apps as real desktop windows,</text>
  <text x="62" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#47556b">scripted for humans and AI agents.</text>
  <text x="62" y="40" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" fill="#6a7686">pure python · scrcpy v5.0.1 wire protocol · zero pip deps</text>

  <!-- phone -->
  <rect x="590" y="70" width="86" height="150" rx="14" fill="#ffffff" stroke="#8b949e" stroke-width="2"/>
  <rect x="598" y="78" width="70" height="134" rx="9" fill="#eef1f5"/>
  <circle cx="633" cy="207" r="4" fill="#8b949e"/>

  <!-- dashed transfer arrow -->
  <path d="M 682 118 C 708 112 716 132 738 126" stroke="#0969da" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity="0.9"/>
  <path d="M 735 118 l 8 8 -11 3 z" fill="#0969da"/>

  <!-- floating app windows -->
  <rect x="748" y="58" width="158" height="112" rx="10" fill="#ffffff" stroke="#bcc4cc" stroke-width="1.5"/>
  <rect x="748" y="58" width="158" height="22" rx="10" fill="#eef1f5"/>
  <circle cx="762" cy="69" r="3.4" fill="#ff5f57"/>
  <circle cx="773" cy="69" r="3.4" fill="#febc2e"/>
  <circle cx="784" cy="69" r="3.4" fill="#28c840"/>
  <rect x="760" y="92" width="90" height="9" rx="4" fill="#d7dde3"/>
  <rect x="760" y="108" width="128" height="9" rx="4" fill="#d7dde3"/>
  <rect x="760" y="124" width="70" height="9" rx="4" fill="#e2e7ec"/>
  <rect x="760" y="140" width="110" height="9" rx="4" fill="#d7dde3"/>

  <rect x="782" y="150" width="168" height="116" rx="10" fill="#ffffff" stroke="#c6ccd3" stroke-width="1.5"/>
  <rect x="782" y="150" width="168" height="22" rx="10" fill="#e9edf2"/>
  <circle cx="796" cy="161" r="3.4" fill="#ff5f57"/>
  <circle cx="807" cy="161" r="3.4" fill="#febc2e"/>
  <circle cx="818" cy="161" r="3.4" fill="#28c840"/>
  <rect x="794" y="184" width="100" height="9" rx="4" fill="#d7dde3"/>
  <rect x="794" y="200" width="132" height="9" rx="4" fill="#d7dde3"/>
  <rect x="794" y="216" width="80" height="9" rx="4" fill="#e2e7ec"/>
  <rect x="794" y="232" width="120" height="9" rx="4" fill="#d7dde3"/>
</svg>
